checked:
  note: scripts/02_verify.py, with DuckDB, before upload
  items:
    - zip and codebook against MANIFEST.json
    - pinned row count and every id once
    - every column of the type its name gives
    - GeoParquet 1.0.0 with a Point on every row
    - geometry filter and coordinate filter return the same events
    - totals of best and deaths_civilians and counts by type equal those counted from the CSV with Python's csv module
    - a DuckDB without the spatial extension opens the file
    - no bloom filters

modifications:
  raw: none. UCDP's zip and codebook, byte for byte.
  parquet:
    - columns typed by name; a value that does not fit stops the build
    - active_year true and false (25.1, 26.1) read as 1 and 0
    - a point geometry added from longitude and latitude
    - sorted by country_id, date_start, id
    - written without bloom filters
